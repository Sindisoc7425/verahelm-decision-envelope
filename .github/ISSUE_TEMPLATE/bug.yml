name: Verifier defect
description: Report a reproducible public-contract or verifier defect.
title: "verifier: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use fictional data only.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Full commit SHA
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Data boundary
      options:
        - label: I included no secrets, private methods, customer material, or real data.
          required: true
