name: Adapter request
description: Request a public-safe mapping from an evidence producer.
title: "adapter: "
labels: ["adapter-request"]
body:
  - type: input
    id: producer
    attributes:
      label: Evidence producer
    validations:
      required: true
  - type: textarea
    id: public_fields
    attributes:
      label: Public fields available
      description: List field names only. Do not submit evidence, logs, prompts, credentials, customer material, or proprietary data.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Data boundary
      options:
        - label: I included no private, personal, customer, credential, or production material.
          required: true
