name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify public release
        run: npm test
